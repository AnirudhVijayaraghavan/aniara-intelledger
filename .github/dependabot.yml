version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 5
      groups:
          github-actions:
              patterns:
                  - '*'
    - package-ecosystem: 'composer'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '09:00'
          timezone: 'America/New_York'
      open-pull-requests-limit: 3
      groups:
          composer-production:
              applies-to: 'version-updates'
              dependency-type: 'production'
              patterns: ['*']
              update-types: ['minor', 'patch']
          composer-development:
              applies-to: 'version-updates'
              dependency-type: 'development'
              patterns: ['*']
              update-types: ['minor', 'patch']
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'tuesday'
          time: '09:00'
          timezone: 'America/New_York'
      open-pull-requests-limit: 3
      groups:
          npm-production:
              applies-to: 'version-updates'
              dependency-type: 'production'
              patterns: ['*']
              update-types: ['minor', 'patch']
          npm-development:
              applies-to: 'version-updates'
              dependency-type: 'development'
              patterns: ['*']
              update-types: ['minor', 'patch']
